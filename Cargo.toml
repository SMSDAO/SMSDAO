
[package]
name = "smsdao"
version = "1.0.0"
description = "SMSDAO - Autonomous Multi-Chain Governance and Arbitrage Bot"
edition = "2021"
license = "MIT"
authors = ["SMSDAO Contributors"]

[lib]
crate-type = ["cdylib", "lib"]
name = "smsdao"

[dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
anchor-client = "0.28.0"
criterion = "0.5"

[[bench]]
name = "large-input"
harness = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1