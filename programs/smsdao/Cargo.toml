[package]
name = "smsdao"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "smsdao"

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
solana-program = "=1.17.0"
spl-token = "4.0.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
anchor-client = "0.29.0"
criterion = "0.5"

[[bench]]
name = "large-input"
harness = false
